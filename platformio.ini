[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
board_build.flash_mode = qio
board_build.f_cpu = 160000000L

lib_deps = 
    cjson

build_flags = 
    -DCONFIG_TCP_SOCKET_MAX=5
    -DCONFIG_UART_BUFFER_SIZE=2048
    -DCONFIG_WIFI_SSID=\"ESP32-C3-Serial-Bridge\"
    -DCONFIG_WIFI_PASSWORD=\"12345678\"
    -Iinclude